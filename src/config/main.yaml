train:
    epochs: 1000
    bs: 1024
    ckpt_freq: 5
    test_freq: 5
    optimizer:
        _target_: torch.optim.AdamW
        lr: 1e-4
        weight_decay: 1e-5
    scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        T_max: ${train.epochs}
        eta_min: 1e-6

seed: 42

wandb:
    project: manifold_learning
    group: default
    tags:
        - train
        - demo
    mode: offline

dataset:
    name: QM9
    pe_dim: 6

gvar:
    max_graph_nodes: 9
    lamb_node: 1.0
    lamb_edge: 1.0
    lamb_commit: 1.0
    lamb_ent: 1.0
    lamb_link: 1.0
    lamb_spec: 0.1
    cluster_sizes: [4, 2, 1]
    encoder:
        node_feat_dim: 4
        hidden_dim: 128
        output_dim: 32
        num_layers: 8
        edge_dim: 3
        pe_dim: 6
    vq:
        codebook_size: 1024
        decay: 0.99
        commitment_weight: 1
        use_cosine_sim: True
    decoder:
        num_layers: 8
        input_dim: 32
        hidden_dim: 128
        output_dim: 4
        edge_dim: 3

accelerate_args:
    mixed_precision: "no"
    step_scheduler_with_optimizer: false

hydra:
    run:
        dir: outputs/vqvae/${now:%Y-%m-%d_%H-%M-%S}
    sweep:
        dir: multirun/vqvae/${now:%Y-%m-%d_%H-%M-%S}
        subdir: ${hydra.job.override_dirname}
